<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sekuvo Admin — USB Authentication</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #0f0f0f;
      color: #fff;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .container {
      text-align: center;
      padding: 2rem;
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 16px;
      width: 380px;
    }
    .logo-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 1.5rem;
    }
    .logo-wrap img {
      width: 120px;
      object-fit: contain;
    }
    .slogan {
      font-size: 11px;
      color: #444;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-top: 0.3rem;
    }
    .divider {
      width: 100%;
      height: 1px;
      background: #2a2a2a;
      margin-bottom: 1.5rem;
    }
    .usb-icon { font-size: 56px; margin-bottom: 1rem; display: block; transition: all 0.3s; }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 1.2rem;
    }
    .locked { background: #2a1a1a; color: #ff6b6b; border: 1px solid #ff6b6b44; }
    .verifying { background: #2a2a1a; color: #ffd93d; border: 1px solid #ffd93d44; }
    .success { background: #1a2a1a; color: #6bcb77; border: 1px solid #6bcb7744; }
    .error { background: #2a1a1a; color: #ff6b6b; border: 1px solid #ff6b6b44; }
    .lock-title { font-size: 18px; font-weight: 600; margin-bottom: 0.4rem; }
    .lock-sub { font-size: 13px; color: #555; margin-bottom: 1.5rem; line-height: 1.6; }
    .progress-wrap {
      width: 100%;
      height: 3px;
      background: #2a2a2a;
      border-radius: 4px;
      overflow: hidden;
      margin-bottom: 1.2rem;
      display: none;
    }
    .progress-wrap.show { display: block; }
    .progress-fill {
      height: 100%;
      width: 0%;
      background: #6c63ff;
      border-radius: 4px;
      transition: width 0.05s linear;
    }
    .usb-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 28px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      border: 1px solid #6c63ff;
      background: transparent;
      color: #6c63ff;
      transition: all 0.2s;
      width: 100%;
      justify-content: center;
    }
    .usb-btn:hover { background: #6c63ff22; }
    .usb-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .webauthn-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 28px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      border: none;
      background: #6c63ff;
      color: #fff;
      transition: all 0.2s;
      width: 100%;
      justify-content: center;
      margin-bottom: 0.75rem;
    }
    .webauthn-btn:hover { background: #5a52e0; }
    .webauthn-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .or-divider {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 1rem 0;
      color: #444;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .or-divider::before, .or-divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: #2a2a2a;
    }
    .usb-info { font-size: 12px; color: #444; margin-top: 0.75rem; }
    .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
    .lost-usb {
      display: block;
      margin-top: 1rem;
      font-size: 12px;
      color: #444;
      text-decoration: none;
      transition: color 0.2s;
    }
    .lost-usb:hover { color: #6c63ff; }
  </style>
</head>
<body>
  <div class="container">

    <div class="logo-wrap">
      <img src="assets/sekuvo.png" alt="Sekuvo Logo">
      <div class="slogan">— Don't Just Build. Secure It. —</div>
    </div>

    <div class="divider"></div>

    <span class="usb-icon" id="usbIcon">🔌</span>

    <div class="status-badge locked" id="statusBadge">
      <span class="dot"></span>
      <span id="statusText">Access Locked</span>
    </div>

    <p class="lock-title">Authentication Required</p>
    <p class="lock-sub">Use your registered security key<br>to access the admin portal.</p>

    <div class="progress-wrap" id="progressWrap">
      <div class="progress-fill" id="progressFill"></div>
    </div>

    <button class="webauthn-btn" id="webauthnBtn" onclick="loginWithSecurityKey()">
      🔐 Login with Security Key
    </button>
    <p id="webauthnStatus" style="font-size: 12px; margin-bottom: 1rem; min-height: 16px;"></p>

    <div class="or-divider">or use old method</div>

    <button class="usb-btn" id="usbBtn">
      🔑 Connect USB Device
    </button>

    <p class="usb-info" id="usbInfo">No USB device detected</p>

    <a href="recovery.html" class="lost-usb">
      🔑 Lost your USB? Emergency access
    </a>

  </div>

  <script src="https://unpkg.com/@simplewebauthn/browser@13/dist/bundle/index.umd.min.js"></script>
  <script src="usb-auth.js"></script>
  <script>
    const WEBAUTHN_SERVER = 'https://sekuvo-admin.onrender.com';

    async function loginWithSecurityKey() {
      const btn = document.getElementById('webauthnBtn');
      const statusEl = document.getElementById('webauthnStatus');

      btn.disabled = true;
      statusEl.style.color = '#888';
      statusEl.textContent = 'Requesting challenge from server...';

      try {
        // Step 1: Server se login options (challenge) mangao
        const optionsRes = await fetch(WEBAUTHN_SERVER + '/api/webauthn/login-options', {
          method: 'POST'
        });
        const options = await optionsRes.json();

        if (!optionsRes.ok) {
          throw new Error(options.message || 'Failed to get login options');
        }

        statusEl.textContent = '🔑 Approve on your security key or phone now...';

        // Step 2: Browser device se sign karwao
        const authResp = await SimpleWebAuthnBrowser.startAuthentication({ optionsJSON: options });

        statusEl.textContent = 'Verifying with server...';

        // Step 3: Signed response server ko bhejo verify karne ke liye
        const verifyRes = await fetch(WEBAUTHN_SERVER + '/api/webauthn/login-verify', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            credentialId: authResp.id,
            response: authResp,
            clientChallenge: options.challenge
          })
        });

        const verifyData = await verifyRes.json();

        if (verifyData.success) {
          statusEl.style.color = '#6bcb77';
          statusEl.textContent = '✅ Access granted! Redirecting...';

          sessionStorage.setItem('adminToken', verifyData.token);
          sessionStorage.setItem('deviceName', verifyData.deviceName);

          setTimeout(() => {
            window.location.href = `${WEBAUTHN_SERVER}/admin.html?token=${verifyData.token}&device=${encodeURIComponent(verifyData.deviceName)}`;
          }, 1000);

        } else {
          throw new Error(verifyData.message || 'Login failed');
        }

      } catch (err) {
        statusEl.style.color = '#ff6b6b';
        if (err.name === 'NotAllowedError') {
          statusEl.textContent = '❌ Cancelled or timed out.';
        } else {
          statusEl.textContent = '❌ ' + err.message;
        }
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
